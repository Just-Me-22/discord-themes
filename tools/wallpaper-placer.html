<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper placer</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e1a1e;
  --card: #15262b;
  --text: #e0f3f5;
  --dim: #a9c3c7;
  --line: #ffffff1f;
  --accent: #2692a2;
  --panel: rgba(19, 50, 56, 0.55);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
p { margin: 0; color: var(--dim); }
.stage {
  position: relative; width: 100%; aspect-ratio: var(--ratio, 16 / 9);
  overflow: hidden; border-radius: 12px; background: #000;
  cursor: grab; touch-action: none; user-select: none; outline: 1px solid var(--line);
}
.stage.dragging { cursor: grabbing; }
.stage.empty { cursor: default; display: grid; place-items: center; }
.stage.empty::after { content: "Drop a picture here, or choose one below"; color: var(--dim); }
.wall { position: absolute; background-repeat: no-repeat; pointer-events: none; }
.panels { position: absolute; inset: 0; pointer-events: none; }
.panels div { position: absolute; background: var(--panel); border-radius: 10px; }
.panels.off { display: none; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 20px; background: var(--card); border-radius: 12px; padding: 16px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--dim); }
label span b { color: var(--text); font-weight: 600; }
input[type="text"], select { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
pre { margin: 0; padding: 14px 16px; background: var(--card); border-radius: 12px; overflow-x: auto; font: 13px/1.6 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Wallpaper placer</h1>
  <p>Drag the picture to move it and scroll to zoom. The lines at the bottom go into your theme file, inside <code>:root</code>.</p>

  <div class="stage empty" id="stage">
    <div class="wall" id="wall"></div>
    <div class="panels" id="panels">
      <div style="left:1.3%; top:5.8%; width:5.8%; height:81%"></div>
      <div style="left:7.4%; top:5.8%; width:15.6%; height:81%"></div>
      <div style="left:23.4%; top:5.8%; width:42%; height:81%"></div>
      <div style="left:68.2%; top:30.8%; width:14.6%; height:41%"></div>
      <div style="left:68.2%; top:75%; width:14.6%; height:6%"></div>
      <div style="left:0; top:96%; width:65.6%; height:4%; border-radius:0"></div>
    </div>
  </div>

  <div class="controls">
    <label>Picture
      <input type="file" id="file" accept="image/*">
    </label>
    <label>Or its address
      <input type="text" id="url" placeholder="https://i.imgur.com/example.png">
    </label>
    <label>Window shape
      <select id="shape">
        <option value="screen">This screen</option>
        <option value="16/9">16:9</option>
        <option value="16/10">16:10</option>
        <option value="21/9">21:9</option>
        <option value="2.25/1">Wide window, 2.25:1</option>
      </select>
    </label>
    <label><span>Zoom <b id="zoomOut">1</b></span>
      <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
    </label>
    <label><span>Blur <b id="blurOut">0px</b></span>
      <input type="range" id="blur" min="0" max="10" step="0.5" value="0">
    </label>
    <label><span>Dim <b id="dimOut">0.5</b></span>
      <input type="range" id="dim" min="0" max="0.9" step="0.01" value="0.5">
    </label>
    <div class="row">
      <label class="row" style="display:flex"><input type="checkbox" id="showPanels" checked> Show the panels</label>
      <button type="button" id="reset">Reset</button>
    </div>
  </div>

  <pre id="out"></pre>
  <div class="row"><button type="button" class="primary" id="copy">Copy</button><span id="copied" style="color:var(--dim)"></span></div>
</main>

<script>
const $ = id => document.getElementById(id);
const stage = $("stage"), wall = $("wall");
const state = { src: "", name: "", nat: null, x: 0.5, y: 0.5, zoom: 1, blur: 0, dim: 0.5 };

function realWidth() { return screen.width || 1920; }

function render() {
  const W = stage.clientWidth;
  const blur = state.blur * W / realWidth();
  const pad = blur * 3;
  const pos = `${(state.x * 100).toFixed(1)}% ${(state.y * 100).toFixed(1)}%`;
  Object.assign(wall.style, {
    inset: `${-pad}px`,
    backgroundImage: `linear-gradient(rgba(0,0,0,${state.dim}), rgba(0,0,0,${state.dim}))${state.src ? `, url("${state.src}")` : ""}`,
    backgroundSize: "cover, cover",
    backgroundPosition: `center, ${pos}`,
    transform: `scale(${state.zoom})`,
    transformOrigin: pos,
    filter: `blur(${blur}px)`
  });
  $("zoomOut").textContent = state.zoom.toFixed(2);
  $("blurOut").textContent = state.blur + "px";
  $("dimOut").textContent = state.dim.toFixed(2);
  $("out").textContent = css();
}

function css() {
  const typed = $("url").value.trim();
  const where = typed || (state.name ? `equicord:///themes/wallpapers/${state.name}` : "YOUR-PICTURE-ADDRESS");
  const pct = v => `${Math.round(v * 1000) / 10}%`;
  return [
    ":root {",
    `  --lp-wallpaper: url("${where}");`,
    `  --lp-wallpaper-x: ${pct(state.x)};`,
    `  --lp-wallpaper-y: ${pct(state.y)};`,
    `  --lp-wallpaper-zoom: ${Math.round(state.zoom * 100) / 100};`,
    `  --lp-wallpaper-blur: ${state.blur}px;`,
    `  --lp-wallpaper-dim: ${Math.round(state.dim * 100) / 100};`,
    "}"
  ].join("\n");
}

function load(src, name) {
  const img = new Image();
  img.onload = () => {
    state.src = src; state.name = name; state.nat = { w: img.naturalWidth, h: img.naturalHeight };
    stage.classList.remove("empty");
    render();
  };
  img.src = src;
}

$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) load(URL.createObjectURL(f), f.name);
});
$("url").addEventListener("change", e => { if (e.target.value.trim()) load(e.target.value.trim(), ""); else render(); });
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) load(URL.createObjectURL(f), f.name);
});

function setShape() {
  const v = $("shape").value;
  const fromScreen = screen.width && screen.height ? `${screen.width} / ${screen.height}` : "16 / 9";
  stage.style.setProperty("--ratio", v === "screen" ? fromScreen : v.replace("/", " / "));
  render();
}
$("shape").addEventListener("change", setShape);

for (const k of ["zoom", "blur", "dim"]) {
  $(k).addEventListener("input", e => { state[k] = parseFloat(e.target.value); render(); });
}
$("showPanels").addEventListener("change", e => $("panels").classList.toggle("off", !e.target.checked));
$("reset").addEventListener("click", () => {
  Object.assign(state, { x: 0.5, y: 0.5, zoom: 1, blur: 0, dim: 0.5 });
  $("zoom").value = 1; $("blur").value = 0; $("dim").value = 0.5;
  render();
});

let drag = null;
stage.addEventListener("pointerdown", e => {
  if (!state.nat) return;
  drag = { x: e.clientX, y: e.clientY };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  const fit = Math.max(W / state.nat.w, H / state.nat.h) * state.zoom;
  const slackX = W - state.nat.w * fit, slackY = H - state.nat.h * fit;
  const clamp = v => Math.min(1, Math.max(0, v));
  if (slackX < -0.5) state.x = clamp(state.x + (e.clientX - drag.x) / slackX);
  if (slackY < -0.5) state.y = clamp(state.y + (e.clientY - drag.y) / slackY);
  drag = { x: e.clientX, y: e.clientY };
  render();
});
const endDrag = () => { drag = null; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", e => {
  if (!state.nat) return;
  e.preventDefault();
  state.zoom = Math.min(4, Math.max(1, state.zoom * Math.exp(-e.deltaY * 0.0015)));
  $("zoom").value = state.zoom;
  render();
}, { passive: false });

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(css());
    $("copied").textContent = "Copied";
  } catch {
    $("copied").textContent = "Select the text above and copy it by hand";
  }
  setTimeout(() => { $("copied").textContent = ""; }, 2000);
});
addEventListener("resize", render);
setShape();
</script>
</body>
</html>
